<section id="contact" class="contact-section py-5">
    <div class="container">
        <div class="row g-5 align-items-center">
            <div class="col-lg-5">
                <p class="section-eyebrow"><span class="eyebrow-bar"></span>LET&rsquo;S CONNECT</p>
                <h2 class="section-title">Schedule a Consultation</h2>
                <p class="section-sub">
                    Tell us about your business challenges and project requirements.
                    Our team will connect you with the appropriate experts to explore
                    how <br/>CS TECH Ai can help.
                </p>
            </div>
            <div class="col-lg-7">
                <form class="contact-form p-4 p-md-5 bg-white shadow-sm rounded">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Business Email<span class="text-danger">*</span></label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone number</label>
                            <input type="tel" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Company<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Purpose of Inquiry</label>
                            <select class="form-select">
                                <option value="">Select Purpose of Inquiry</option>
                                <option>General Information</option>
                                <option>Service/Solution Enquiry</option>
                                <option>Feedback</option>
                                <option>Careers</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">How we can Help</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="consent" required>
                                <label class="form-check-label small" for="consent">
                                    By signing up I allow CSTECH Ai to use my email address for sending professional updates and
                                    invitations to conferences and events. Subject to the <a href="#">Privacy Policy</a>.
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary submit-btn">Submit Enquiry</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
