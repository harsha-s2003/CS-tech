# Local Apache + PHP for testing the website exactly as the live server serves it
# (clean URLs, .htaccess redirects, and the PHP form handler in mail/).
# Uses the Apache and PHP that come with XAMPP; does not touch XAMPP's own configuration,
# and runs next to XAMPP's normal Apache (that one uses port 80, this one 8080).
#
# Start: double-click seo-migration\local-apache\start-local-server.bat
#        (or run: F:\xampp\apache\bin\httpd.exe -f "F:\xampp\htdocs\CS-tech_NewPages\seo-migration\local-apache\httpd.conf")
# Open:  http://localhost:8080/
# Stop:  close that window (Ctrl+C)
#
# Why not http://localhost/CS-tech_NewPages/ ? The site is built for the root of a domain
# (https://cstech.ai/about), so its clean URLs only work when the site is the root - as here.
#
# If XAMPP or the website folder move, change these paths:
ServerRoot "F:/xampp/apache"
Define SITE "F:/xampp/htdocs/CS-tech_NewPages"
Define LOGS "F:/xampp/htdocs/CS-tech_NewPages/seo-migration/local-apache/logs"
Define PHPDIR "F:/xampp/php"

Listen 127.0.0.1:8080
ServerName localhost

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule env_module modules/mod_env.so

# PHP (same lines as XAMPP's conf/extra/httpd-xampp.conf)
LoadFile "${PHPDIR}/php8ts.dll"
LoadFile "${PHPDIR}/libpq.dll"
LoadFile "${PHPDIR}/libsqlite3.dll"
LoadModule php_module "${PHPDIR}/php8apache2_4.dll"
PHPINIDir "${PHPDIR}"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
AddType image/avif .avif
AddType image/webp .webp
PidFile "${LOGS}/httpd.pid"
ErrorLog "${LOGS}/error.log"
LogFormat "%h %t \"%r\" %>s %b" short
CustomLog "${LOGS}/access.log" short

DocumentRoot "${SITE}"
<Directory "C:/">
    AllowOverride None
</Directory>
<Directory "F:/">
    AllowOverride None
</Directory>
<Directory "${SITE}">
    # same as typical shared hosting (cPanel): .htaccess fully allowed
    AllowOverride All
    Require all granted
</Directory>
<Files ".ht*">
    Require all denied
</Files>
DirectoryIndex index.html
