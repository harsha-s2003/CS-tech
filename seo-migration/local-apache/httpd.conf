# Local Apache for testing the website exactly as the live server serves it (clean URLs + .htaccess).
# Uses the Apache that comes with XAMPP; does not touch XAMPP's own configuration.
#
# Start (from the website folder):   F:\xampp\apache\bin\httpd.exe -f "F:\cs\CS-tech_NewPages\seo-migration\local-apache\httpd.conf"
# Open:                              http://localhost:8080/
# Stop:                              close that window (Ctrl+C)
#
# If XAMPP or the website folder move, change these three paths:
ServerRoot "F:/xampp/apache"
Define SITE "F:/cs/CS-tech_NewPages"
Define LOGS "F:/cs/CS-tech_NewPages/seo-migration/local-apache/logs"

Listen 127.0.0.1:8080
ServerName localhost

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule env_module modules/mod_env.so

TypesConfig conf/mime.types
AddType image/avif .avif
AddType image/webp .webp
PidFile "${LOGS}/httpd.pid"
ErrorLog "${LOGS}/error.log"
LogFormat "%h %t \"%r\" %>s %b" short
CustomLog "${LOGS}/access.log" short

DocumentRoot "${SITE}"
<Directory "C:/">
    AllowOverride None
</Directory>
<Directory "F:/">
    AllowOverride None
</Directory>
<Directory "${SITE}">
    # same as typical shared hosting (cPanel): .htaccess fully allowed
    AllowOverride All
    Require all granted
</Directory>
<Files ".ht*">
    Require all denied
</Files>
DirectoryIndex index.html
